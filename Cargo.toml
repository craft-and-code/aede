[workspace]
resolver = "3"
members = ["crates/aede-accounts", "crates/aede-core", "crates/aede-devices", "crates/aede-server", "crates/aede-cli", "crates/aede-dsp"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/craft-and-code/aede"
rust-version = "1.89"

[workspace.dependencies]
# Shared analysis engine; tools/build.sh selects the latest published release.
flaccompagnon-core = { git = "https://github.com/craft-and-code/FlacCompagnon", tag = "v0.9.5" }
# Tag reading for the containers Aede has no parser of its own for.
lofty = "0.25"
# HTTP for M1, behind aede-core's `fetch` feature. Pinned rather than floating:
# ureq reserves the right to change its TLS provider in a minor release, and
# the provider is what decides whether the static musl build still links.
ureq = "=3.4"
# The M2 API uses typed JSON and a single HTTP/WebSocket server stack.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.7.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
hyper = { version = "=1.11.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "service"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
