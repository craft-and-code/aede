[package]
name = "aede-dsp"
description = "Aede's audio sample processing foundation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["loudness"]
loudness = ["dep:ebur128"]

[[example]]
name = "profile"
required-features = ["loudness"]

[dependencies]
biquad = "=0.6.0"
ebur128 = { version = "=0.1.10", optional = true }
rubato = "=5.0.0"
