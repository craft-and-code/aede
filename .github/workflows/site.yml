name: Site

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "docs/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install native audio build libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - name: Verify the documentation renderer
        run: |
          python3 tools/project_stats_tests.py
          python3 tools/build_site_tests.py
      - name: Fetch locked build dependencies
        run: cargo fetch --locked
      - name: Inventory active unit tests without executing them
        run: python3 tools/project-stats.py --tests --output target/project-stats.json
      - name: Build the bilingual website from Markdown
        run: python3 tools/build-site.py --check --project-stats target/project-stats.json
      - name: Build Rust API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps
      - name: Include Rustdoc and verify the complete publication
        run: |
          mkdir -p dist-site/docs/rust
          cp -R target/doc/. dist-site/docs/rust/
          python3 tools/check-site.py dist-site --require-rustdoc
      - uses: actions/upload-artifact@v4
        with:
          name: aede-website
          path: dist-site/
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aede-website
          path: dist-site/
      - name: Publish website and documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-site
          keep_files: false
          allow_empty_commit: ${{ github.event_name == 'workflow_dispatch' }}
