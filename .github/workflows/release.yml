name: Release

# Builds distinct CLI and desktop App artifacts for every platform into a
# GitHub Release. Trigger by pushing a version tag:
#
#     git tag v0.6.0
#     git push origin v0.6.0
#
# or run it manually from the Actions tab (workflow_dispatch), which builds the
# binaries without publishing anything.
#
# Archives include the executable, licence and README. Builds are unsigned.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-AppleSilicon
          # The musl archive uses ffplay for playback; CPAL is GNU-only on Linux.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            label: Linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.89 (the declared MSRV)
        uses: dtolnay/rust-toolchain@1.89
        with:
          targets: ${{ matrix.target }}

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # A tag says which version this is; so does the manifest. When the two
      # disagree, somebody is about to publish `v0.2.0` of a program that
      # reports `0.3.0` when asked — and `aede --version` is what a bug report
      # quotes. Cheap to check here, confusing for a year if it slips.
      - name: The tag and the manifest must agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${manifest}"
            echo "Set the version in Cargo.toml, commit, then move the tag."
            exit 1
          fi
          echo "version ${manifest}, tagged ${GITHUB_REF_NAME}"

      # A tag that does not build is worse than no tag: it is published, people
      # download it, and the failure is theirs to discover. The tests run before
      # the archive is made rather than in a separate workflow nobody waits for.
      - name: Tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # One archive per platform, named so the Releases page needs no legend,
      # holding the binary and the two files somebody unpacking it will want:
      # what it is allowed to do, and where the manual is.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "${{ github.ref_type }}" = "tag" ] || version="$(git rev-parse --short HEAD)"
          name="aede-CLI-${version}-${{ matrix.label }}"
          mkdir -p "dist/${name}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/aede.exe" "dist/${name}/"
          else
            cp "target/${{ matrix.target }}/release/aede" "dist/${name}/"
          fi
          cp LICENSE README.md "dist/${name}/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "${name}" > /dev/null
          else
            tar czf "${name}.tar.gz" "${name}"
          fi
          # A checksum beside each archive, because a binary downloaded from
          # the internet deserves one and because it costs a line.
          for archive in *.tar.gz *.zip; do
            [ -e "$archive" ] || continue
            if command -v sha256sum > /dev/null; then
              sha256sum "$archive" > "${archive}.sha256"
            else
              shasum -a 256 "$archive" > "${archive}.sha256"
            fi
          done
          ls -lh

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: aede-CLI-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS-AppleSilicon
          - os: ubuntu-22.04
            label: Linux-x86_64
          - os: windows-latest
            label: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
      - name: Install desktop prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev
      - name: Fetch exact engine and app dependencies
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path desktop/Cargo.toml --locked
          npm ci --prefix desktop
      - name: Verify the release versions before building
        run: python tools/check-release.py
      - name: Verify the native server application
        shell: bash
        run: bash desktop/tools/check.sh
      - name: Build desktop installers
        working-directory: desktop
        run: npm run build:native
      - name: Name and checksum the App packages
        run: python tools/package-desktop.py --label ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: aede-App-${{ matrix.label }}
          path: dist-desktop/*
          if-no-files-found: error
          retention-days: 7

  publish:
    permissions:
      contents: write
    needs: [build, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      # The changelog below walks the commits since the previous tag, which
      # needs the actual history: this job would otherwise only download build
      # artifacts, with no checkout at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect every platform's archive
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -lh dist

      # Keep curated highlights in the repository and append the commit history.
      - name: Draft the notes
        shell: bash
        run: |
          set -euo pipefail
          previous=$(git tag --sort=-v:refname | grep -A1 "^${GITHUB_REF_NAME}$" | tail -n1 || true)
          {
            if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
              cat "docs/releases/${GITHUB_REF_NAME}.md"
            else
              echo "## What's new in ${GITHUB_REF_NAME}"
              echo
              echo "<!-- TODO before publishing: two to four real highlights, in plain words. -->"
            fi
            echo
            if [ -n "$previous" ] && [ "$previous" != "$GITHUB_REF_NAME" ]; then
              echo "<details><summary>Commits since ${previous}</summary>"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${previous}..${GITHUB_REF_NAME}"
              echo
              echo
              echo "</details>"
            else
              echo "_First tagged release — no previous tag to compare against._"
            fi
          } > notes.md

      - name: Append what to download and how to run it
        shell: bash
        run: |
          cat >> notes.md <<'EOF'

          ---

          `aede` is a single executable: unpack it, put it somewhere on your
          `PATH`, and run it. Nothing is installed, nothing runs in the
          background, and it never writes to your music files.

          | Your system | Download |
          | --- | --- |
          | **macOS** (M1 and later) | `aede-CLI-*-macOS-AppleSilicon.tar.gz` |
          | **Linux** (x86_64, musl-compatible) | `aede-CLI-*-Linux-x86_64.tar.gz` — statically linked, no glibc to match |
          | **Windows** (x64) | `aede-CLI-*-Windows-x64.zip` |

          The **App** packages are separate: `aede-App-*-macOS-AppleSilicon.dmg`,
          `aede-App-*-Linux-x86_64.AppImage` / `.deb` / `.rpm`, and
          `aede-App-*-Windows-x64.msi` / `.exe`. Open Aède to add folders,
          start its local HTTPS server and export its public connection for Phémios.
          The App uses its own private data directory, separate from ordinary CLI data.
          See the desktop-server guide in the project documentation.

          Windows archives are built and tested on a native Windows runner.
          Windows terminal playback controls are implemented; interactive
          console/output acceptance remains pending. Local writer delegation
          remains Unix-only. Linux archives use ffplay for audio output;
          install FFmpeg to use `aede play` on Linux.

          ```sh
          tar xzf aede-CLI-*-macOS-AppleSilicon.tar.gz
          cd aede-CLI-*-macOS-AppleSilicon
          ./aede scan ~/Music
          ./aede stats
          ```

          Each archive ships with a `.sha256` file beside it, so a download can
          be checked before it is trusted.

          **macOS — first launch.** These builds are not signed with an Apple
          Developer ID, so Gatekeeper refuses them on the first run. Once, in a
          terminal:

          ```sh
          xattr -dr com.apple.quarantine ./aede
          ```

          **ffmpeg** is not bundled and is not needed by most of the program.
          It supports `aede copy --compress`, `aede spectrum`, and playback
          of Opus/AAC/ALAC. Linux archive playback also requires ffplay.
          Install it with macOS: `brew install ffmpeg`,
          Debian/Ubuntu: `sudo apt install ffmpeg`.
          EOF

      - name: Publish the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Aède ${{ github.ref_name }}"
          draft: true
          prerelease: false
          files: dist/*
          body_path: notes.md
