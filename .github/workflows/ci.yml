name: CI

# The same gate the project uses locally, run on every push.
#
# It calls `tools/check.sh` rather than listing the steps again: formatting,
# clippy with no warning tolerated, the tests, the documentation links and a
# release build are already written down there, and a CI that spelled them out
# a second time would drift from the script contributors actually run. One
# gate, not two.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AEDE_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4

      # Pinned to the MSRV the manifest declares rather than floating on
      # stable: `rust-version = "1.89"` is a promise to whoever builds this,
      # and a CI running something newer would let a feature slip in that
      # breaks it without anybody noticing.
      - name: Install Rust 1.89 (the declared MSRV)
        uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Install ALSA development files and FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev autoconf automake libtool ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      # `check.sh` runs with `--offline`, which is deliberate: the dependencies
      # are fetched once here, and a step that then needs the network means one
      # was added without being discussed.
      - name: Install static Opus build tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install autoconf automake libtool
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Everything that must pass before a commit
        if: runner.os != 'Windows'
        run: bash tools/check.sh

      # No bash script on Windows, and no `--offline` subtleties either: the
      # point of this leg is that the parsers and the path handling work on a
      # system where a separator is a backslash.
      - name: Desktop release helper tests (Windows, offline)
        if: runner.os == 'Windows'
        run: python tools/desktop_release_tests.py

      - name: Build helper tests (Windows, offline)
        if: runner.os == 'Windows'
        run: python tools/update_flaccompagnon_tests.py

      - name: Project statistics tests (Windows, offline)
        if: runner.os == 'Windows'
        run: python tools/project_stats_tests.py

      - name: Documentation renderer tests (Windows, offline)
        if: runner.os == 'Windows'
        run: python tools/build_site_tests.py

      - name: Gapless measurement helper tests (Windows, offline)
        if: runner.os == 'Windows'
        run: python tools/gapless_tests.py

      - name: Integer digital-capture comparison tests (Windows, offline)
        if: runner.os == 'Windows'
        run: python tools/bit_perfect_tests.py

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
      - name: Install native desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev autoconf automake libtool
      - name: Install static Opus build tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install autoconf automake libtool
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Fetch locked dependencies
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path desktop/Cargo.toml --locked
          npm ci --prefix desktop
      - name: Verify version coherence
        run: python tools/check-release.py
      - name: Complete desktop gate
        shell: bash
        run: bash desktop/tools/check.sh
