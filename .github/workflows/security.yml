name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  registry-advisories:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89
      - name: Test the audit client without network access
        run: python3 -B -m unittest discover -s tools -p audit_dependencies_tests.py
      - name: Fetch the reviewed dependency versions
        run: cargo fetch --locked
      # This explicit network check stays separate from offline tools/check.sh.
      # Only crates.io package names/versions are sent; Git coverage is reported.
      - name: Check locked registry dependencies against OSV
        run: python3 -B tools/audit-dependencies.py

  desktop-advisories:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch the locked desktop tree
        run: |
          cargo fetch --manifest-path desktop/Cargo.toml --locked
          npm ci --prefix desktop --ignore-scripts
      - name: Audit native desktop registry dependencies
        run: python3 -B tools/audit-dependencies.py --manifest-path desktop/Cargo.toml --desktop-compatibility-warnings
      - name: Audit desktop npm dependencies
        run: npm audit --prefix desktop
